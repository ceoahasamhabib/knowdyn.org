<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kdGradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="kdGradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>
    <filter id="kdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Gradient Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#kdGradBorder)" />

  <!-- Inner Dark Cosmic Core -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="#070C18" />

  <!-- Accent Geometry (Subtle Grid/Diamond) -->
  <circle cx="256" cy="256" r="160" fill="#4F46E5" opacity="0.08" filter="url(#kdGlow)" />
  <circle cx="380" cy="130" r="12" fill="#34D399" />

  <!-- KD Monogram Text -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
        fill="url(#kdGradText)" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif"
        font-weight="900" font-size="220" letter-spacing="4">KD</text>
</svg>
