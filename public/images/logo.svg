<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="480" height="96">
  <defs>
    <linearGradient id="kdLogoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="kdLogoText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>
  </defs>

  <!-- KD Icon Badge -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#kdLogoBorder)" />
    <rect x="3" y="3" width="74" height="74" rx="15" fill="#070C18" />
    <text x="40" y="47" text-anchor="middle" dominant-baseline="middle"
          fill="url(#kdLogoText)" font-family="system-ui, -apple-system, sans-serif"
          font-weight="900" font-size="34" letter-spacing="1">KD</text>
  </g>

  <!-- Typography: Title & Tagline -->
  <text x="104" y="44" fill="#0F172A" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif"
        font-weight="800" font-size="26" letter-spacing="-0.5">Knowledge Dynamics</text>

  <!-- Scholar Badge -->
  <rect x="382" y="24" width="70" height="22" rx="6" fill="#EEF2FF" stroke="#C7D2FE" />
  <text x="417" y="38.5" text-anchor="middle" dominant-baseline="middle"
        fill="#4338CA" font-family="system-ui, -apple-system, sans-serif"
        font-weight="800" font-size="11">Scholar</text>

  <!-- Subtitle -->
  <text x="104" y="68" fill="#64748B" font-family="system-ui, -apple-system, sans-serif"
        font-weight="600" font-size="11" letter-spacing="1.5">OPEN ACCESS PUBLISHING &amp; RESEARCH</text>
</svg>
